<!DOCTYPE html>
<html>
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Family Finance Tracker</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e0da;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7873;
  --accent: #2a78d6; --accent-ink: #ffffff;
  --s-income: #2a78d6; --s-spend: #eb6834; --s-emi: #1baf7a;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --grid: #e7e5df;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #242422; --border: #333330;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8e8d86;
    --accent: #3987e5; --accent-ink: #ffffff;
    --s-income: #3987e5; --s-spend: #d95926; --s-emi: #199e70; --grid: #2c2c2a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.hbar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; margin-right: auto; }
.monthnav { display: flex; align-items: center; gap: 4px; }
.monthnav .lbl { min-width: 132px; text-align: center; font-weight: 600; }
.monthnav input[type=month] { position: absolute; opacity: 0; pointer-events: none; width: 0; }
.iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.pill { font-size: 12px; color: var(--muted); }
nav.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 96px; }
h2 { font-size: 15px; margin: 0 0 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { input.cell { width: 80px; } }
@media (max-width: 820px) { .g4 { grid-template-columns: 1fr 1fr; } .g2 { grid-template-columns: 1fr; } }

.kpi .k { color: var(--text-2); font-size: 12px; }
.kpi .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
.kpi .s { color: var(--muted); font-size: 12px; margin-top: 2px; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; color: var(--text-2); font-weight: 600; }
td.r, th.r { text-align: right; }
tr.total td { font-weight: 700; border-bottom: 0; }
tr.dim td { color: var(--muted); }
.scroll { overflow-x: auto; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st-good { color: var(--good); } .st-warn { color: #b57e00; } .st-crit { color: var(--critical); } .st-muted { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-warn { color: var(--warning); } }

.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar > i.over { background: var(--critical); }
.bar > i.hi { background: var(--critical); }
.hidden { display: none !important; }
.preview { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 12px; font-size: 13px; }
.due-soon td:first-child { border-left: 3px solid var(--critical); }
.hide-sm {} @media (max-width: 560px) { .hide-sm { display: none; } }
:root { --bar: #2a78d6; }

.btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--critical); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
input.in, select.in { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 9px; min-width: 0; }
input.in.amt { width: 110px; text-align: right; }
input.cell { width: 100px; text-align: right; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; }
input.cell:hover, input.cell:focus { border-color: var(--border); background: var(--surface); }
.chk { width: 18px; height: 18px; accent-color: var(--good); cursor: pointer; }
.note { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 12px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: var(--surface); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.fab { position: fixed; right: 18px; bottom: 18px; z-index: 30; border: 0; border-radius: 28px; padding: 14px 20px; background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.2); cursor: pointer; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .modal-bg { align-items: center; } }
.modal { background: var(--surface); width: 100%; max-width: 440px; border-radius: 14px 14px 0 0; padding: 18px; max-height: 90vh; overflow: auto; }
@media (min-width: 640px) { .modal { border-radius: 14px; } }
.modal label { display: block; font-size: 12px; color: var(--text-2); margin: 10px 0 4px; }
.modal .in { width: 100%; }
.modal .actions { display: flex; gap: 8px; margin-top: 16px; }

.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 60; font-size: 13px; }
.saving { font-size: 12px; color: var(--muted); }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-2); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); white-space: nowrap; z-index: 5; }
.tip b { display: block; margin-bottom: 2px; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.loading { text-align: center; padding: 60px 0; color: var(--muted); }
</style>
<style id="ios">
/* ================= iOS look (overrides) ================= */
:root {
  --bg: #f2f2f7; --surface: #ffffff; --surface-2: #f2f2f7; --border: rgba(60,60,67,.14);
  --text: #000; --text-2: #3c3c43; --muted: rgba(60,60,67,.6);
  --accent: #007aff; --accent-ink: #fff; --grid: rgba(60,60,67,.12);
  --good: #0ca30c; --critical: #d03b3b; --warning: #fab219;
  --sep: rgba(60,60,67,.18); --fill: rgba(118,118,128,.12);
  --hero1: #0a84ff; --hero2: #5e5ce6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --cOther: #a1a1a6;
  --tabbar: rgba(249,249,249,.86);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e; --border: rgba(84,84,88,.6);
    --text: #fff; --text-2: rgba(235,235,245,.8); --muted: rgba(235,235,245,.6);
    --accent: #0a84ff; --grid: rgba(84,84,88,.5); --sep: rgba(84,84,88,.65); --fill: rgba(118,118,128,.24);
    --hero1: #0a64d6; --hero2: #4b49c9;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --cOther: #636366;
    --tabbar: rgba(22,22,24,.86);
  }
}
html { -webkit-text-size-adjust: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: var(--bg); -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
/* top bar */
header { background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid transparent; transition: border-color .2s; }
header.scrolled { border-bottom-color: var(--sep); }
.hbar { padding: 8px 16px; gap: 8px; }
.brand { display: none; }
nav.tabs, #fab, .fab { display: none !important; }
.monthnav { margin-right: auto; background: var(--fill); border-radius: 10px; padding: 2px; gap: 0; }
.monthnav .iconbtn { border: 0; background: transparent; width: 32px; height: 30px; font-size: 18px; color: var(--accent); }
.monthnav .lbl { border: 0; background: transparent; min-width: 112px; font-weight: 600; font-size: 15px; padding: 5px 4px; }
.monthnav .lbl + input + button { }
#todayM { display: none; }
.hbar .iconbtn[aria-label="Lock app"] { border: 0; background: var(--fill); border-radius: 50%; width: 32px; height: 32px; font-size: 14px; }
.saving { font-size: 11px; }
main { padding: 4px 16px calc(110px + env(safe-area-inset-bottom)); }
/* large title */
.lt { display: flex; align-items: flex-end; gap: 8px; margin: 6px 2px 14px; }
.lt h1 { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: .3px; margin: 0; }
.lt .back { color: var(--accent); font-size: 17px; cursor: pointer; display: block; margin-bottom: 2px; }
.lt-wrap .back { color: var(--accent); font-size: 17px; cursor: pointer; display: inline-block; margin: 2px 0 0; }
/* cards & grouped lists */
.card { border: 0; border-radius: 14px; padding: 14px 16px; box-shadow: none; }
.grid { gap: 12px; }
.kpi .k { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 22px; letter-spacing: -.2px; }
h2 { font-size: 17px; font-weight: 600; }
.sec { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .3px; margin: 22px 16px 6px; font-weight: 500; }
.sec a, .sec .link { float: right; text-transform: none; color: var(--accent); font-size: 15px; cursor: pointer; letter-spacing: 0; }
.list { background: var(--surface); border-radius: 14px; overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; min-height: 48px; background: var(--surface); cursor: pointer; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; border-top: .5px solid var(--sep); }
.li.noicon + .li.noicon::before { left: 16px; }
.li:active { background: var(--fill); }
.li .ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 17px; flex: none; color: #fff; }
.li .tx { flex: 1; min-width: 0; }
.li .t1 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t2 { font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .rt { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.li .rt .a { font-size: 16px; font-weight: 500; }
.li .rt .b { font-size: 12px; color: var(--muted); margin-top: 1px; }
.li .chev { color: var(--muted); font-size: 20px; margin-left: -4px; flex: none; }
table th { color: var(--muted); font-weight: 500; }
th, td { border-bottom: .5px solid var(--sep); }
.btn { border-radius: 10px; border: 0; background: var(--fill); color: var(--accent); font-weight: 500; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { color: var(--critical); }
.chip { border: 0; background: var(--fill); padding: 6px 12px; font-size: 13px; }
.chip.on { background: var(--accent); color: #fff; }
.in, input.in, select.in { border: 0; background: var(--fill); border-radius: 10px; padding: 11px 12px; font-size: 16px; }
.in:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
/* hero */
.hero { border-radius: 20px; padding: 18px 18px 16px; color: #fff; background: linear-gradient(135deg, var(--hero1), var(--hero2)); box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--hero2) 70%, transparent); }
.hero .k { font-size: 14px; opacity: .85; font-weight: 500; }
.hero .big { font-size: 38px; font-weight: 700; letter-spacing: -.5px; margin: 2px 0 2px; font-variant-numeric: tabular-nums; }
.hero .sub { font-size: 13px; opacity: .85; }
.hero .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.hero .row3 > div { background: rgba(255,255,255,.14); border-radius: 12px; padding: 9px 10px; }
.hero .row3 .l { font-size: 12px; opacity: .85; }
.hero .row3 .v { font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.2); margin-left: 6px; vertical-align: middle; }
/* insights */
.ins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ins .card { margin: 0; padding: 13px 14px; }
.ins .e { font-size: 20px; }
.ins .h { font-size: 13px; color: var(--muted); margin-top: 6px; }
.ins .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
.ins .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
/* donut */
.donut { display: flex; gap: 16px; align-items: center; }
.donut svg { flex: none; width: 132px; height: 132px; }
.donut .lg { flex: 1; min-width: 0; font-size: 14px; }
.donut .lg div { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.donut .lg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.donut .lg span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.donut .lg b { font-weight: 500; font-variant-numeric: tabular-nums; }
.donut text { fill: var(--text); }
/* tab bar */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--tabbar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
#tabbar button { border: 0; background: none; color: var(--muted); font-size: 10px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; cursor: pointer; }
#tabbar button svg { width: 26px; height: 26px; }
#tabbar button.on { color: var(--accent); }
#tabbar .add span.plus { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin-top: -14px; box-shadow: 0 6px 16px -4px color-mix(in srgb, var(--accent) 60%, transparent); }
#tabbar .add span.plus svg { width: 26px; height: 26px; }
/* sheets (modals) */
.modal-bg { background: rgba(0,0,0,.35); align-items: flex-end !important; animation: fadeIn .2s ease; }
.modal { border-radius: 14px 14px 0 0 !important; max-width: 640px; padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); animation: sheetUp .32s cubic-bezier(.2,.9,.3,1); }
.modal::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto 12px; }
.modal h2 { font-size: 20px; }
.modal .actions { position: sticky; bottom: 0; background: var(--surface); }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.enter { animation: viewIn .28s cubic-bezier(.2,.9,.3,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.toast { border-radius: 12px; bottom: calc(96px + env(safe-area-inset-bottom)); background: rgba(30,30,30,.92); color: #fff; }
/* swipe rows */
.sw { position: relative; overflow: hidden; }
.sw .del { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; background: #ff3b30; color: #fff; border: 0; font-size: 15px; font-weight: 600; }
.sw .li { transition: transform .25s ease; z-index: 1; }
.sw.dragging .li { transition: none; }
/* pull to refresh */
#ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 56px); transform: translate(-50%, -130px); z-index: 25; background: var(--surface); border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.15); transition: transform .2s; font-size: 18px; color: var(--accent); }
#ptr.spin span { display: inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* quick add */
.qa { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; animation: sheetUp .32s cubic-bezier(.2,.9,.3,1); padding-top: env(safe-area-inset-top); }
.qa .top { display: flex; align-items: center; padding: 10px 16px; }
.qa .top button { border: 0; background: none; color: var(--accent); font-size: 17px; cursor: pointer; }
.qa .top .ttl { flex: 1; text-align: center; font-weight: 600; font-size: 17px; }
.qa .amt { text-align: center; font-size: 48px; font-weight: 700; letter-spacing: -1px; padding: 6px 16px 0; font-variant-numeric: tabular-nums; min-height: 64px; }
.qa .amt small { font-size: 26px; color: var(--muted); font-weight: 600; margin-right: 2px; }
.qa .expr { text-align: center; color: var(--muted); font-size: 14px; min-height: 18px; }
.qa .cats { display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px 6px; scrollbar-width: none; }
.qa .cats::-webkit-scrollbar { display: none; }
.qa .cat { flex: none; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; color: var(--text); font-size: 11px; cursor: pointer; }
.qa .cat .e { width: 52px; height: 52px; border-radius: 16px; background: var(--surface); display: grid; place-items: center; font-size: 24px; border: 2px solid transparent; }
.qa .cat.on .e { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.qa .cat span.n { max-width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qa .meta { display: flex; gap: 8px; padding: 6px 16px; align-items: center; flex-wrap: wrap; }
.qa .meta .chip { font-size: 13px; }
.qa .meta input.in { flex: 1; min-width: 140px; padding: 9px 12px; font-size: 15px; }
.qa .recent { display: flex; gap: 6px; padding: 2px 16px 4px; overflow-x: auto; }
.qa .pad { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--surface-2); }
.qa .pad button { border: 0; background: var(--surface); color: var(--text); font-size: 26px; font-weight: 500; height: 54px; border-radius: 12px; cursor: pointer; }
.qa .pad button:active { background: var(--fill); }
.qa .pad .save { grid-column: 1 / -1; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; height: 50px; }
.qa .pad .save:disabled { opacity: .4; }
/* passcode */
.lock { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }

<script>
/* ===== iPhone app bridge: talks to your Google Apps Script over the internet using your PIN ===== */
(function () {
  var K_URL = 'ff_api_url', K_TOK = 'ff_token', queue = [];
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function post(body) {
    return fetch(get(K_URL), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { return r.text(); }).then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('The app link doesn\'t look right. Check it ends with /exec and the deployment access is "Anyone".'); } });
  }
  function exec(fn, args, ok, fail) {
    if (!get(K_URL) || !get(K_TOK)) { queue.push([fn, args, ok, fail]); showLogin(); return; }
    post({ action: 'call', token: get(K_TOK), fn: fn, args: args }).then(function (res) {
      if (res.ok) { ok && ok(res.result); }
      else if (res.error === 'AUTH') { set(K_TOK, null); queue.push([fn, args, ok, fail]); showLogin('Please unlock again.'); }
      else { fail && fail(new Error(res.error)); }
    }, function (e) { fail && fail(new Error(navigator.onLine === false ? 'No internet connection.' : (e.message || 'Could not reach Google.'))); });
  }
  window.google = { script: { get run() {
    var ok, fail, px = new Proxy({}, { get: function (t, n) {
      if (n === 'withSuccessHandler') return function (f) { ok = f; return px; };
      if (n === 'withFailureHandler') return function (f) { fail = f; return px; };
      return function () { exec(n, [].slice.call(arguments), ok, fail); };
    } });
    return px;
  } } };
  function $(id) { return document.getElementById(id); }
  function showLogin(msg) {
    $('ffLogin').style.display = 'flex'; $('ffErr').textContent = msg || '';
    var hasUrl = !!get(K_URL); $('ffUrl').value = get(K_URL) || '';
    $('ffUrlWrap').style.display = hasUrl ? 'none' : ''; $('ffChange').style.display = hasUrl ? '' : 'none';
    setTimeout(function () { (hasUrl ? $('ffPin') : $('ffUrl')).focus(); }, 100);
  }
  $('ffEditUrl').onclick = function (e) { e.preventDefault(); $('ffUrlWrap').style.display = ''; $('ffChange').style.display = 'none'; $('ffUrl').focus(); };
  $('ffForm').onsubmit = function (e) {
    e.preventDefault();
    var url = $('ffUrl').value.trim() || get(K_URL);
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url || '')) { $('ffErr').textContent = 'Paste the Web app link from Apps Script (it ends with /exec).'; $('ffUrlWrap').style.display = ''; return; }
    set(K_URL, url); $('ffBtn').disabled = true; $('ffBtn').textContent = 'Checking…'; $('ffErr').textContent = '';
    post({ action: 'login', pin: $('ffPin').value }).then(function (res) {
      $('ffBtn').disabled = false; $('ffBtn').textContent = 'Unlock';
      if (!res.ok) { $('ffErr').textContent = res.error; return; }
      set(K_TOK, res.token); $('ffPin').value = ''; $('ffLogin').style.display = 'none';
      var q = queue.splice(0); q.forEach(function (c) { exec.apply(null, c); });
    }, function (err) { $('ffBtn').disabled = false; $('ffBtn').textContent = 'Unlock'; $('ffErr').textContent = err.message; });
  };
  window.ffLock = function () {
    if (!confirm('Lock the app on this phone? You will need the PIN to open it again.')) return;
    var t = get(K_TOK); set(K_TOK, null); if (t) post({ action: 'logout', token: t }).catch(function () {}); location.reload();

  });

/* ---------- Trends ---------- */
function vTrend() {
  return '<div class="card"><div class="row"><h2 style="margin:0">Up to 12 months ending ' + mLabel(M) + '</h2><span class="spacer"></span><span class="note">Future months use expected income and planned spending</span></div><div class="chart" id="chTrend" style="margin-top:8px"></div></div>' +
    '<div class="card"><h2>Month by month</h2><div class="scroll" id="trendTbl"></div></div>' +
    '<div class="card"><h2>Spending by category (recent months)</h2><div class="scroll" id="catTbl"></div></div>';
}
after.trend = function () {
  var months = [], inc = [], sp = [], em = [], fr = [], nt = [], rows = '';
  var st = startMonth();
  for (var i = 11; i >= 0; i--) {
    var m = addM(M, -i); if (m < st) continue;
    var s = summary(m), iv = s.actual !== null ? s.actual : s.expected, spv = s.future ? Math.max(s.planned, s.spent) : s.spent;
    var net = iv - spv - s.emi + s.fromFunds - s.toFunds;
    months.push(m); inc.push(iv); sp.push(spv); em.push(s.emi); fr.push(s.fromFunds - s.toFunds); nt.push(net);
    rows = '<tr><td>' + mLabel(m) + (s.future ? ' <span class="note">(projected)</span>' : '') + '</td><td class="r num">' + inr(iv) + (s.incFromActual ? '' : ' <span class="note">exp.</span>') + '</td><td class="r num">' + inr(spv) + (s.future && spv === s.planned ? ' <span class="note">plan</span>' : '') + '</td><td class="r num">' + inr(s.emi) + '</td><td class="r num">' + inr(iv - spv - s.emi) + '</td><td class="r num">' + (s.fromFunds - s.toFunds ? inr(s.fromFunds - s.toFunds) : '—') + '</td><td class="r num"><b>' + inr(net) + '</b></td></tr>' + rows;
  }
  barChart($('chTrend'), months, [{ name: 'Income', color: 'var(--s-income)', values: inc }, { name: 'Spending', color: 'var(--s-spend)', values: sp }, { name: 'EMI', color: 'var(--s-emi)', values: em }]);
  $('trendTbl').innerHTML = '<table><tr><th>Month</th><th class="r">Income</th><th class="r">Spending</th><th class="r">EMI</th><th class="r">Surplus / deficit</th><th class="r">From savings (net)</th><th class="r">Net</th></tr>' + rows +
    '<tr class="total"><td>12-month total</td><td class="r num">' + inr(sum(inc)) + '</td><td class="r num">' + inr(sum(sp)) + '</td><td class="r num">' + inr(sum(em)) + '</td><td class="r num">' + inr(sum(inc) - sum(sp) - sum(em)) + '</td><td class="r num">' + inr(sum(fr)) + '</td><td class="r num">' + inr(sum(nt)) + '</td></tr></table>';
  var m6 = months.filter(function (m) { return m <= ym(new Date()); }).slice(-6), names = cats(true).map(function (c) { return c.Name; });
  var h = '<table><tr><th>Category</th>' + m6.map(function (m) { return '<th class="r">' + mLabel(m, true) + '</th>'; }).join('') + '<th class="r">Avg</th></tr>';
  names.forEach(function (n) {

    if (!sum(vals)) return;
    h += '<tr><td>' + esc(n) + '</td>' + vals.map(function (v) { return '<td class="r num">' + (v ? inr(v, true) : '—') + '</td>'; }).join('') + '<td class="r num">' + inr(sum(vals) / m6.length, true) + '</td></tr>';
  });
  $('catTbl').innerHTML = h + '</table>';
};

function settingModal(table, name) {

/* ======================= Modal helpers ======================= */

/* ======================= Charts (plain SVG) ======================= */
function niceMax(v) { if (v <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function shortInr(v) { return v >= 1e7 ? (v / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr' : v >= 1e5 ? (v / 1e5).toFixed(1).replace(/\.0$/, '') + 'L' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : String(Math.round(v)); }
function axes(W, H, pad, max) {
  var g = '';
  for (var i = 0; i <= 4; i++) {
    var y = pad.t + (H - pad.t - pad.b) * (1 - i / 4);
    g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (pad.l - 6) + '" y="' + (y + 4) + '" text-anchor="end">₹' + shortInr(max * i / 4) + '</text>';
  }
  return g;
}
function xLabels(months, W, pad, H, bw) {
  var n = months.length, step = Math.ceil(n / Math.max(1, Math.floor((W - pad.l - pad.r) / 46)));
  return months.map(function (m, i) { if (i % step) return ''; var x = pad.l + bw * (i + .5); return '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle">' + mLabel(m, true) + '</text>'; }).join('');
}
function barChart(el, months, series, opt) {
  opt = opt || {};
  var W = Math.max(300, el.clientWidth || 600), H = 230, pad = { l: 46, r: 8, t: 10, b: 24 };
  var max = niceMax(Math.max.apply(null, series.reduce(function (a, s) { return a.concat(s.values); }, [0])));
  var bw = (W - pad.l - pad.r) / months.length, ih = H - pad.t - pad.b, k = series.length;
  var inner = Math.min(opt.single ? bw - 2 : (bw * .78) / k, 22), gap = 2;
  var svg = axes(W, H, pad, max);
  months.forEach(function (m, i) {
    var groupW = inner * k + gap * (k - 1), x0 = pad.l + bw * i + (bw - groupW) / 2;
    series.forEach(function (s, j) {
      var v = s.values[i], h = Math.max(0, v / max * ih), x = x0 + j * (inner + gap), y = pad.t + ih - h, r = Math.min(4, inner / 2, h);
      if (h > 0) svg += '<path d="M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + inner - r) + 'Q' + (x + inner) + ',' + y + ' ' + (x + inner) + ',' + (y + r) + 'V' + (y + h) + 'Z" fill="' + s.color + '"/>';
    });
    svg += '<rect x="' + (pad.l + bw * i) + '" y="' + pad.t + '" width="' + bw + '" height="' + ih + '" fill="transparent" data-i="' + i + '"/>';
  });
  svg += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + (pad.t + ih) + '" y2="' + (pad.t + ih) + '" stroke="var(--muted)" stroke-width="1"/>';
  svg += xLabels(months, W, pad, H, bw);
  el.innerHTML = (k > 1 ? '<div class="legend">' + series.map(function (s) { return '<span style="--c:' + s.color + '">' + s.name + '</span>'; }).join('') + '</div>' : '') +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(series.map(function (s) { return s.name; }).join(', ')) + ' by month">' + svg + '</svg>';
  hover(el, function (i) { return '<b>' + mLabel(months[i]) + '</b>' + series.map(function (s) { return '<div><span class="sw" style="background:' + s.color + '"></span>' + s.name + ': ' + inr(s.values[i]) + '</div>'; }).join(''); });
}
function areaChart(el, months, vals, color, name) {
  var W = Math.max(300, el.clientWidth || 600), H = 230, pad = { l: 46, r: 8, t: 10, b: 24 };
  var max = niceMax(Math.max.apply(null, vals.concat([0]))), bw = (W - pad.l - pad.r) / months.length, ih = H - pad.t - pad.b;
  var pts = vals.map(function (v, i) { return [pad.l + bw * (i + .5), pad.t + ih - v / max * ih]; });
  var svg = axes(W, H, pad, max);
  if (pts.length) {
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('');
    svg += '<path d="' + line + 'L' + pts[pts.length - 1][0] + ',' + (pad.t + ih) + 'L' + pts[0][0] + ',' + (pad.t + ih) + 'Z" fill="' + color + '" opacity=".14"/>';
    svg += '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2"/>';
  }
  months.forEach(function (m, i) { svg += '<rect x="' + (pad.l + bw * i) + '" y="' + pad.t + '" width="' + bw + '" height="' + ih + '" fill="transparent" data-i="' + i + '"/>'; });
  svg += '<line class="xh" x1="0" x2="0" y1="' + pad.t + '" y2="' + (pad.t + ih) + '" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/><circle class="dot" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="2" style="display:none"/>';
  svg += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + (pad.t + ih) + '" y2="' + (pad.t + ih) + '" stroke="var(--muted)"/>' + xLabels(months, W, pad, H, bw);
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + name + ' by month">' + svg + '</svg>';
  var xh = el.querySelector('.xh'), dot = el.querySelector('.dot');
  hover(el, function (i) {
    xh.setAttribute('x1', pts[i][0]); xh.setAttribute('x2', pts[i][0]); xh.style.display = ''; dot.setAttribute('cx', pts[i][0]); dot.setAttribute('cy', pts[i][1]); dot.style.display = '';
    return '<b>' + mLabel(months[i]) + '</b>' + name + ': ' + inr(vals[i]);
  }, function () { xh.style.display = 'none'; dot.style.display = 'none'; });
}
function hover(el, html, leave) {
  var tip = document.createElement('div'); tip.className = 'tip'; tip.style.display = 'none'; el.appendChild(tip);
  el.querySelectorAll('rect[data-i]').forEach(function (r) {
    var show = function (e) {
      tip.innerHTML = html(+r.getAttribute('data-i')); tip.style.display = '';
      var b = el.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - b.left;

<script>

          if (h === ls('ff_pc')) { done(); return; }
          fails++; if (fails >= 5) { until = Date.now() + 30000; fails = 0; }
          shake(fails ? 'Wrong passcode' : 'Too many tries. Wait 30s');
        });
      }, 120);
    });
    if (mode === 'unlock' && ls('ff_fid')) setTimeout(function () { faceUnlock(done); }, 350);
  }
  window.showLock = showLock;
  function askPasscode() {
    if (lockEl || document.querySelector('#ffLogin[style*="flex"]')) return;
    modal('Protect the app?', '<p style="margin:0 0 6px">Set a 4-digit passcode so the app asks for it every time it opens' + (window.PublicKeyCredential ? ', and optionally unlock with Face ID' : '') + '.</p><p class="note">You can change this later in More → Security.</p>',
      function () { setTimeout(function () { showLock('set'); }, 50); }, null);
    var m = document.querySelector('.modal'); if (m) { m.querySelector('.btn.primary').textContent = 'Set passcode'; m.querySelector('[data-cancel]').textContent = 'Not now'; m.querySelector('[data-cancel]').addEventListener('click', function () { ls('ff_pc_skip', '1'); }); }
  }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function offerFaceId() {
    if (!window.PublicKeyCredential || !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return;
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (ok) { if (ok && confirm('Also unlock with Face ID?')) enrollFaceId(); });
  }
  function enrollFaceId() {
    if (!window.PublicKeyCredential) { toast('Face ID is not available here'); return; }
    var rnd = function (n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; };
    navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: 'Family Finance' }, user: { id: rnd(16), name: 'family-finance', displayName: 'Family Finance' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000 } })
      .then(function (c) { ls('ff_fid', b64(c.rawId)); toast('Face ID unlock is on'); if (TAB === 'more') render(); }, function () { toast('Face ID was not set up'); });
  }
  function faceUnlock(ok) {
    var id = ls('ff_fid'); if (!id || !navigator.credentials) return;
    var ch = new Uint8Array(32); crypto.getRandomValues(ch);
    navigator.credentials.get({ publicKey: { challenge: ch, allowCredentials: [{ type: 'public-key', id: unb64(id), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } })
      .then(function () { ok(); }, function () { var h = $('lkHint'); if (h) h.textContent = 'Use your passcode'; });
  }
  // lock on open and when coming back after a minute
  if (ls('ff_pc') && ls('ff_token')) showLock('unlock');
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) ls('ff_hid', String(Date.now()));
    else if (ls('ff_pc') && ls('ff_token') && !lockEl && Date.now() - +(ls('ff_hid') || 0) > 60000) showLock('unlock');
  });

  /* ---------- pull to refresh ---------- */
  var py = null, pd = 0;
  document.addEventListener('touchstart', function (e) { if (window.scrollY <= 0 && !document.querySelector('.modal-bg,.qa,.lock') && !e.target.closest('.sw')) { py = e.touches[0].clientY; pd = 0; } else py = null; }, { passive: true });
  document.addEventListener('touchmove', function (e) { if (py === null) return; pd = Math.max(0, e.touches[0].clientY - py); ptr.style.transform = 'translate(-50%,' + (Math.min(pd, 110) - 130) + 'px) rotate(' + pd * 3 + 'deg)'; }, { passive: true });
  document.addEventListener('touchend', function () {
    if (py === null) return; py = null;
    if (pd > 80) { ptr.classList.add('spin'); ptr.style.transform = 'translate(-50%, 10px)'; window.onLoaded = function () { ptr.classList.remove('spin'); ptr.style.transform = ''; toast('Updated'); }; load(); }
    else ptr.style.transform = '';
  });

<script>
/* ===== Expense form with "Split into items" (one bill → several entries) ===== */
(function () {
  function parts(note) {   // "Beer, Cigarette and Swiggy" → ["Beer", "Cigarette", "Swiggy"]
    return String(note || '').split(/\s*(?:,|\+|&|\/|;|\band\b)\s*/i).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function terms(a) {      // "500+250+823" → [500, 250, 823]
    var s = String(a || '').replace(/[,₹\s]/g, '');
    return /^\d+(\.\d+)?(\+\d+(\.\d+)?)+$/.test(s) ? s.split('+').map(Number) : [];
  }
  function catOpts(sel) {
    return cats(true).filter(function (c) { return c.Active || c.Name === sel; }).map(function (c) { return '<option' + (c.Name === sel ? ' selected' : '') + '>' + esc(c.Name) + '</option>'; }).join('');
  }
  function rowHtml(r) {
    return '<div class="sp-row"><input class="in num sp-a" inputmode="decimal" placeholder="₹" value="' + esc(r.a === undefined ? '' : r.a) + '">' +
      '<select class="in sp-c">' + catOpts(r.c) + '</select><input class="in sp-n" placeholder="what (e.g. Beer)" value="' + esc(r.n || '') + '"><button type="button" class="sp-x" title="Remove">✕</button></div>';
  }

  /* ---- how it was paid: UPI app + bank, cash, credit card (linked card entry) ---- */
  var MODES = ['GPay', 'PhonePe', 'Paytm', 'UPI', 'Cash', 'Credit card', 'Debit card', 'Bank transfer'];
  var lastMode = '';
  function bankish(m) { return /^(GPay|PhonePe|Paytm|UPI|Debit card|Bank transfer)$/.test(m); }
  function parseMode(e) { var m = String(e.Mode || ''); if (/^card/i.test(m)) return { mode: 'Credit card', card: m.replace(/^card\s*·?\s*/i, '') }; return { mode: MODES.indexOf(m) >= 0 ? m : '', card: '' }; }
  function upiBank(m) { return appSetting('UpiBank_' + m) || appSetting('PayFromDefault') || ''; }
  function payHtml(e) {
    var pm = parseMode(e), mode = pm.mode || (e.ID ? '' : lastMode), bank = e.Bank || (bankish(mode) ? upiBank(mode) : '');
    var cs = D.Cards.filter(function (c) { return c.Active !== false || c.Name === pm.card; });
    return '<div class="pm-row"><div><label>Paid by</label><select class="in" name="PayMode">' + (mode ? '' : '<option value="">Not set</option>') + MODES.map(function (m) { return '<option' + (m === mode ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select></div>' +
      '<div class="pm-bank"' + (bankish(mode) ? '' : ' hidden') + '><label>From bank</label><select class="in" name="PayBank">' + D.Banks.map(function (b) { return '<option' + (b.Name === bank ? ' selected' : '') + '>' + esc(b.Name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="pm-card"' + (mode === 'Credit card' ? '' : ' hidden') + '><label>Card</label><select class="in" name="PayCard">' + cs.map(function (c) { return '<option' + (c.Name === pm.card ? ' selected' : '') + '>' + esc(c.Name) + '</option>'; }).join('') + '</select></div></div>';
  }
  function linkedTxn(id) { return D.CardTxns.find(function (t) { return t.Note && (t.Note.indexOf('exp#' + id) === 0 || t.Note.indexOf('Rithi #' + id) === 0); }); }
  // saves Mode/Bank on the expense and keeps the card's Spend entry in step (so the card's available limit is right)
  function payFields(f) {
    var m = f.PayMode.value; if (!m) return {};
    if (m === 'Credit card') { var c = D.Cards.find(function (x) { return x.Name === f.PayCard.value; }); return { Mode: 'Card · ' + f.PayCard.value, Bank: '', _card: c }; }
    return { Mode: m, Bank: bankish(m) ? f.PayBank.value : '', _card: null };
  }
  function syncCard(exp, pf) {
    var t = linkedTxn(exp.ID);
    if (!pf._card) { if (t && pf.Mode !== undefined) del('CardTxns', { ID: t.ID }); return; }
    save('CardTxns', { ID: t ? t.ID : undefined, Date: exp.Date, CardID: pf._card.ID, Kind: 'Spend', Amount: exp.Amount, Party: String(exp.Note || '').split(/\s+[-–—:|]\s+/)[0], Fee: '', AvailBefore: '', AvailAfter: '', Note: t && t.Note.indexOf('Rithi #') === 0 ? t.Note : 'exp#' + exp.ID + ' · ' + (exp.Note || exp.Category), CreatedAt: t ? t.CreatedAt : new Date().toISOString() });
  }
  window.expenseModal = function (e) {
    e = e || { Date: M === ym(new Date()) ? today() : M + '-01', Category: (cats()[0] || {}).Name, Amount: '', Note: '' };
    modal((e.ID ? 'Edit' : 'Add') + ' expense',
      field('Date', '<input class="in" type="date" name="Date" value="' + esc(e.Date) + '" required>') +
      field('Category', '<select class="in" name="Category">' + catOpts(e.Category) + '</select>') +
      field('Amount (you can type 500+250)', '<input class="in" name="Amount" inputmode="decimal" value="' + esc(e.Amount) + '" required autofocus>') +
      field('Note', '<input class="in" name="Note" value="' + esc(e.Note) + '">') + payHtml(e) +
      '<button type="button" class="w-link sp-open" style="margin-top:10px">✂ Split into items</button>' +
      '<div class="sp-box" hidden><div class="note" style="margin:8px 0 4px">One bill, several things: each line is saved as its own entry (same date' + (e.Mode ? ' and ' + esc(e.Mode) : '') + ').</div>' +
      '<div class="sp-rows"></div><div class="sp-foot"><button type="button" class="w-link sp-add">+ item</button><span class="sp-left"></span></div></div>',
      function (f) {
        var box = f.querySelector('.sp-box'), splitting = box && !box.hidden;
        var amt = evalAmt(f.Amount.value);
        if (!splitting) {
          if (!(amt > 0)) { toast('Enter a valid amount'); return false; }
          var pf = payFields(f), o1 = { ID: e.ID, Date: f.Date.value, Category: f.Category.value, Amount: amt, Note: f.Note.value, CreatedAt: e.CreatedAt || new Date().toISOString() };
          if (pf.Mode !== undefined) { o1.Mode = pf.Mode; o1.Bank = pf.Bank; lastMode = f.PayMode.value; }
          save('Expenses', o1); if (pf.Mode !== undefined || linkedTxn(o1.ID)) syncCard(o1, pf.Mode !== undefined ? pf : { _card: linkedTxn(o1.ID) ? D.Cards.find(function (c) { return c.ID === linkedTxn(o1.ID).CardID; }) : null });
          return;
        }
        var rows = [].map.call(f.querySelectorAll('.sp-row'), function (r) { return { a: evalAmt(r.querySelector('.sp-a').value), c: r.querySelector('.sp-c').value, n: r.querySelector('.sp-n').value.trim() }; })
          .filter(function (r) { return r.a !== '' || r.n; });
        if (rows.length < 2) { toast('Add at least two items, or close the split'); return false; }
        if (rows.some(function (r) { return !(r.a > 0); })) { toast('Every item needs an amount'); return false; }
        var tot = Math.round(sum(rows, function (r) { return r.a; }) * 100) / 100;
        var single = terms(f.Amount.value).length ? sum(terms(f.Amount.value), function (x) { return x; }) : amt;
        if (single > 0 && Math.abs(single - tot) > 0.5) { toast('Items add up to ' + inr(tot) + ', but the amount is ' + inr(single)); return false; }
        var now = new Date().toISOString(), pf2 = payFields(f);
        rows.forEach(function (r, i) {
          var o = { Date: f.Date.value, Category: r.c, Amount: r.a, Note: r.n, CreatedAt: i === 0 && e.CreatedAt ? e.CreatedAt : now };
          if (i === 0 && e.ID) o.ID = e.ID;
          if (pf2.Mode !== undefined) { o.Mode = pf2.Mode; o.Bank = pf2.Bank; } else { if (e.Mode) o.Mode = e.Mode; if (e.Bank) o.Bank = e.Bank; }
          if (e.Source) o.Source = e.Source;
          save('Expenses', o);
          if (pf2.Mode !== undefined) syncCard(o, pf2);
          else if (i === 0 && linkedTxn(o.ID)) { var lt = linkedTxn(o.ID); save('CardTxns', Object.assign({}, lt, { Amount: r.a })); }   // first part keeps the card entry, at its new amount
          else if (/^card/i.test(String(e.Mode || ''))) syncCard(o, { _card: D.Cards.find(function (c) { return 'Card · ' + c.Name === e.Mode; }) || null });
        });
        toast('Saved as ' + rows.length + ' entries · ' + inr(tot));
      },
      e.ID ? function () { var lt = linkedTxn(e.ID); del('Expenses', { ID: e.ID }); if (lt) del('CardTxns', { ID: lt.ID }); } : null);

    var ms = document.querySelectorAll('.modal'), f = ms[ms.length - 1];
    if (!f) return;
    var box = f.querySelector('.sp-box'), list = f.querySelector('.sp-rows'), left = f.querySelector('.sp-left');
    function refresh() {
      var tot = sum([].map.call(list.querySelectorAll('.sp-a'), function (i) { return Number(evalAmt(i.value)) || 0; }), function (x) { return x; });
      var t = terms(f.Amount.value), whole = t.length ? sum(t, function (x) { return x; }) : Number(evalAmt(f.Amount.value)) || 0;
      left.innerHTML = !whole ? 'Total ' + inr(tot) : Math.abs(whole - tot) < 0.5 ? '<span style="color:var(--good)">Adds up to ' + inr(whole) + ' ✓</span>' : (whole > tot ? 'Left to split: <b>' + inr(whole - tot) + '</b>' : '<span style="color:var(--critical)">' + inr(tot - whole) + ' more than the amount</span>');
    }
    function add(r) { list.insertAdjacentHTML('beforeend', rowHtml(r)); refresh(); }
    f.querySelector('.sp-open').onclick = function () {
      if (!box.hidden) { box.hidden = true; this.textContent = '✂ Split into items'; f.Category.disabled = false; return; }
      box.hidden = false; this.textContent = '✕ Don’t split'; f.Category.disabled = true; list.innerHTML = '';
      var ps = parts(f.Note.value), ts = terms(f.Amount.value), n = Math.max(2, ps.length, ts.length);
      for (var i = 0; i < n; i++) add({ a: ts[i], c: f.Category.value, n: ps[i] || '' });
      var first = list.querySelector('.sp-a'); if (first && !first.value) first.focus();
    };
    f.PayMode.addEventListener('change', function () {
      var m = f.PayMode.value; f.querySelector('.pm-bank').hidden = !bankish(m); f.querySelector('.pm-card').hidden = m !== 'Credit card';
      if (bankish(m)) { var b = upiBank(m); if (b) f.PayBank.value = b; }
    });
    f.querySelector('.sp-add').onclick = function () { add({ c: f.Category.value }); };
    list.addEventListener('click', function (ev) { var x = ev.target.closest('.sp-x'); if (x && list.children.length > 2) { x.parentNode.remove(); refresh(); } });
    list.addEventListener('input', refresh);
    f.Amount.addEventListener('input', function () { if (!box.hidden) refresh(); });
  };
  window.FFPAY = { MODES: MODES, bankish: bankish, upiBank: upiBank, syncCard: syncCard, linkedTxn: linkedTxn, setLast: function (m) { lastMode = m; }, getLast: function () { return lastMode; } };
})();

<script>
/* ===== Phone extras (Oct 2026): "Paid by" in quick add, payment tags in the list, bank tally on Home ===== */
(function () {
  var P = window.FFPAY;

  /* ---- quick add: Paid by → bank / card ---- */
  var SHORT = { 'Credit card': '💳 Card', 'Cash': '💵 Cash', 'Debit card': 'Debit', 'Bank transfer': 'Transfer' };
  window.qaPayInit = function (el) {
    if (!P) return;
    var box = el.querySelector('#qaPay'); if (!box) return;
    var lastCard = (function () { var t = D.CardTxns.filter(function (x) { return x.Kind === 'Spend'; }).sort(function (a, b) { return String(b.CreatedAt || b.Date).localeCompare(String(a.CreatedAt || a.Date)); })[0]; return t ? (D.Cards.find(function (c) { return c.ID === t.CardID; }) || {}).Name : ''; })();
    var st = el._pay = { mode: P.getLast() || '', bank: '', card: lastCard || '' };
    if (P.bankish(st.mode)) st.bank = P.upiBank(st.mode);
    function chip(attr, val, label, on) { return '<span class="chip' + (on ? ' on' : '') + '" ' + attr + '="' + esc(val) + '">' + esc(label) + '</span>'; }
    function draw() {
      var h = '<div class="qp-row"><span class="qp-l">Paid by</span>' + ['GPay', 'PhonePe', 'Paytm', 'Credit card', 'Cash', 'UPI', 'Debit card', 'Bank transfer'].filter(function (m) { return P.MODES.indexOf(m) >= 0; }).map(function (m) { return chip('data-pm', m, SHORT[m] || m, st.mode === m); }).join('') + '</div>';
      if (P.bankish(st.mode)) h += '<div class="qp-row"><span class="qp-l">From</span>' + D.Banks.map(function (b) { return chip('data-pb', b.Name, b.Name, st.bank === b.Name); }).join('') + '</div>';
      if (st.mode === 'Credit card') {
        var cs = D.Cards.filter(function (c) { return c.Active !== false; });
        if (!st.card && cs[0]) st.card = cs[0].Name;
        h += '<div class="qp-row"><span class="qp-l">Card</span>' + cs.map(function (c) { return chip('data-pc', c.Name, c.Name, st.card === c.Name); }).join('') + '</div>';
      }
      box.innerHTML = h;
      box.querySelectorAll('.chip.on').forEach(function (c) { var r = c.parentNode; r.scrollLeft = Math.max(0, c.offsetLeft - r.offsetLeft - 60); });
    }
    box.addEventListener('click', function (e) {
      var t = e.target.closest('[data-pm],[data-pb],[data-pc]'); if (!t) return; e.stopPropagation();
      if (t.dataset.pm !== undefined) { st.mode = st.mode === t.dataset.pm ? '' : t.dataset.pm; if (P.bankish(st.mode)) st.bank = P.upiBank(st.mode) || st.bank || (D.Banks[0] || {}).Name || ''; }
      if (t.dataset.pb !== undefined) st.bank = t.dataset.pb;
      if (t.dataset.pc !== undefined) st.card = t.dataset.pc;
      draw();
    });
    draw();
  };
  window.qaPayFields = function (el) {
    var st = el && el._pay; if (!P || !st || !st.mode) return null;
    if (st.mode === 'Credit card') { var c = D.Cards.find(function (x) { return x.Name === st.card; }); if (!c) return null; return { Mode: 'Card · ' + c.Name, Bank: '', _card: c, mode: st.mode }; }
    return { Mode: st.mode, Bank: P.bankish(st.mode) ? st.bank : '', _card: null, mode: st.mode };
  };
  window.qaPaySaved = function (o, pf) { if (!pf) return; P.setLast(pf.mode); if (pf._card) P.syncCard(o, pf); };

  /* ---- spending list: how it was paid ---- */
  window.payTag = function (e) {
    var m = String(e.Mode || ''), t = '';
    if (/^card/i.test(m)) t = '💳 ' + m.replace(/^card\s*·?\s*/i, '');
    else if (m) t = m + (e.Bank ? ' · ' + e.Bank : '');
    if (e.Source === 'Rithi') t = (t ? t + ' · ' : '') + '🤖';
    return t ? '<div class="ptag">' + esc(t) + '</div>' : '';
  };

  /* ---- Home: bank tally + the usual fix for a gap ---- */
  window.homeTally = function (s) {
    if (!window.bankTally || M !== today().slice(0, 7) || !D.Banks.length) return '';
    var BT = bankTally();
    var st = BT.diff === null ? (BT.actual === null ? 'Enter today’s bank balances' : 'Set the start balance') : Math.abs(BT.diff) < 1 ? '<span style="color:var(--good)">Tallies ✓</span>' : '<b style="color:' + (BT.diff < 0 ? 'var(--critical)' : '#b57e00') + '">' + (BT.diff < 0 ? inr(-BT.diff) + ' not recorded' : inr(BT.diff) + ' extra') + '</b>';
    var h = '<div class="sec">Bank tally<a class="r" data-go="banks">Open</a></div><div class="list"><div class="li" data-go="banks"><div class="ic" style="background:var(--c3)">🏦</div><div class="tx"><div class="t1">In your banks now</div><div class="t2">' + st + '</div></div><div class="rt"><div class="a">' + (BT.actual === null ? '—' : inr(BT.actual)) + '</div></div><span class="chev">›</span></div></div>';
    // measured from the tally start (opening balance + everything recorded since), not from ₹0 on the 1st

    if (Math.abs(gapN) >= 1) h += '<div class="card m-gap">' + (gapN > 0
      ? 'Banks hold <b>' + inr(gapN) + ' more</b> than the tally expects. If you took it from savings (or it came in) and didn’t record it:<div class="bp-acts">' + (D.Funds.length ? '<button class="btn sm primary" data-fundtx="Withdraw" data-amt="' + gapN + '">Record ' + inr(gapN) + ' from savings</button>' : '') + '<button class="btn sm" data-goto="plan">It was income</button><button class="btn sm" data-tallyreset>Accept · start tally from now</button></div>'
      : 'Banks hold <b>' + inr(-gapN) + ' less</b> than the tally expects. Spends or card-bill payments not entered yet?<div class="bp-acts"><button class="btn sm primary" data-tallyexp="' + (-gapN) + '">Add ' + inr(-gapN) + ' as expense</button><button class="btn sm" data-mcards="bills">Mark card bills paid</button><button class="btn sm" data-tallyreset>Accept · start tally from now</button></div>') + '</div>';
    return h;
  };
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-mcards]'); if (!t || t.closest('.modal')) return;
    if (window.CC && CC.setTab) CC.setTab(t.dataset.mcards); TAB = 'cards'; window.scrollTo(0, 0); render();
  });
})();

      if (!S) return; var x = fromAi(res);
      if (x && x.kind === 'question') return showAnswer(x.q, text);
      if (x && x.kind === 'entries') { S.acts = x.actions; return preview(x.reply); }
      notUnderstood(text, x && x.reply);
    }, function () { if (S) notUnderstood(text, 'The AI isn’t reachable right now.'); });
  }
  function notUnderstood(text, why) {
    S.el.innerHTML = top('Not sure') + '<div class="vs-heard">' + esc(text) + '</div><div class="ans"><div class="say">' + esc(why || 'I couldn’t work that out.') + ' Try: “Spent 250 on petrol by GPay” or “How much on food this month?”</div></div>' + orb(false, 'Tap to try again') + typeBox(text); bind();
    speak('Sorry, I did not get that. Please say it again.');
  }

  /* preview cards */
  var ICON = { exp: '🧾', bank: '🏦', card: '💳', wallet: '👛', bal: '🏦' };
  function payLbl(a) { if (a.mode === 'Credit card') { var c = cardById(a.card); return c ? '💳 ' + c.Name : '💳 Which card?'; } return a.mode === 'Cash' ? '💵 Cash' : a.mode + (a.bank ? ' · ' + a.bank : ''); }
  function pvCard(a, i) {
    var col = 'var(--c1)', title = '', sub = '', tags = [];
    if (a.t === 'exp') {
      col = 'var(--c' + (1 + Math.max(0, cats(true).findIndex(function (c) { return c.Name === a.category; })) % 7) + ')';
      title = a.note || a.category; sub = a.note ? a.category : 'Expense';
      tags.push('<span class="chip' + (a.catSure ? '' : ' warn') + '" data-pk="cat" data-i="' + i + '">' + (window.catEmoji ? catEmoji(a.category) : '🏷️') + ' ' + esc(a.category || 'Pick category') + '</span>');
      tags.push('<span class="chip' + (a.payAssumed || (a.mode === 'Credit card' && (!a.card || a.amb)) ? ' warn' : '') + '" data-pk="pay" data-i="' + i + '">' + esc(payLbl(a)) + (a.payAssumed ? ' ?' : '') + '</span>');
      tags.push('<span class="chip" data-pk="date" data-i="' + i + '">📅 ' + dayLbl(a.date) + '</span>');
      return box(window.catEmoji ? catEmoji(a.category) : '🧾');
    }
    if (a.t === 'bank') {
      col = a.kind === 'Withdrawal' || a.kind === 'Transfer' ? 'var(--c2)' : 'var(--c3)';
      title = { Salary: 'Salary', Refund: 'Refund', Credit: 'Money in', Withdrawal: 'Cash withdrawn', Transfer: 'Transfer' }[a.kind];
      sub = a.kind === 'Transfer' ? a.bank + ' → ' + a.to : (a.kind === 'Withdrawal' ? 'from ' : 'into ') + a.bank + (a.kind === 'Salary' && a.person ? ' · income for ' + a.person : '');
      tags.push('<span class="chip" data-pk="bank" data-i="' + i + '">🏦 ' + esc(a.bank) + '</span>'); tags.push('<span class="chip" data-pk="date" data-i="' + i + '">📅 ' + dayLbl(a.date) + '</span>');
      return box(a.kind === 'Salary' ? '💰' : a.kind === 'Withdrawal' ? '🏧' : a.kind === 'Transfer' ? '🔁' : '↩️');
    }
    if (a.t === 'card') { var c = cardById(a.card) || {}; col = 'var(--c7)'; title = c.Name + (a.kind === 'Payment' ? ' bill paid' : ' refund'); sub = a.kind === 'Payment' ? 'from ' + (a.from || '?') : 'back on the card'; if (a.kind === 'Payment') tags.push('<span class="chip" data-pk="from" data-i="' + i + '">🏦 from ' + esc(a.from || '?') + '</span>'); tags.push('<span class="chip" data-pk="date" data-i="' + i + '">📅 ' + dayLbl(a.date) + '</span>'); return box(a.kind === 'Payment' ? '✅' : '↩️'); }
    if (a.t === 'wallet') { var w = cardById(a.card) || {}; col = 'var(--c7)'; title = w.Name + ' → ' + a.wallet; sub = 'Loaded ' + inr(a.amount) + ' + fee ' + inr(a.fee) + (a.toBank ? ' · to ' + a.toBank : ''); return box('👛', a.total); }
    if (a.t === 'bal') { col = 'var(--c3)'; title = a.bank + ' balance'; sub = 'Set as of now'; return box('🏦'); }
    function box(ic, amt) {
      return '<div class="pv"><div class="pv-r"><div class="pv-ic" style="background:' + col + '">' + ic + '</div><div class="pv-t"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></div><div class="pv-amt" data-amt="' + i + '">' + inr(amt !== undefined ? amt : a.amount) + '</div><button class="pv-x" data-pv="' + i + '" aria-label="Remove">✕</button></div>' +
        (tags.length ? '<div class="pv-tags">' + tags.join('') + '</div>' : '') + (impact(a) ? '<div class="pv-imp">' + impact(a) + '</div>' : '') + '</div>';
    }
  }
  function preview(reply) {
    var acts = S.acts, tot = sum(acts, function (a) { return a.t === 'wallet' ? a.total : a.amount; }), need = acts.some(function (a) { return a.t === 'exp' && a.mode === 'Credit card' && !a.card; });
    S.el.innerHTML = top(acts.length > 1 ? acts.length + ' entries' : 'Check and save') + '<div class="vs-heard" style="min-height:0;font-size:15px;font-weight:500;color:var(--muted)">“' + esc(S.heard) + '”</div>' +
      acts.map(pvCard).join('') + (acts.some(function (a) { return a.payAssumed; }) ? '<div class="note" style="margin:2px 4px 6px">? = how it was paid wasn’t said, so I used your last one. Tap to change.</div>' : '') +
      '<div class="vs-acts"><button class="pv-act" data-v="again">' + (SR ? '🎤 Again' : 'Again') + '</button><button class="pv-act primary" data-v="save"' + (need ? ' disabled' : '') + '>Save' + (acts.length > 1 ? ' all · ' + inr(tot) : ' ' + inr(tot)) + '</button></div>';
    var say = acts.length === 1 ? sayAct(acts[0]) : acts.length + ' entries, ' + words(tot) + ' in total.';
    speak((reply && reply.length < 90 ? reply + ' ' : '') + say + ' Shall I save?');
  }
  function sayAct(a) {
    if (a.t === 'exp') return words(a.amount) + ' for ' + (a.note || a.category) + ', ' + (a.mode === 'Credit card' ? 'on the ' + ((cardById(a.card) || {}).Name || '') + ' card' : a.mode === 'Cash' ? 'in cash' : 'by ' + a.mode) + (a.dateSaid ? ', ' + dayLbl(a.date) : '') + '.';
    if (a.t === 'bank') return { Salary: 'Salary', Refund: 'Refund', Credit: 'Money in', Withdrawal: 'Cash withdrawn', Transfer: 'Transfer' }[a.kind] + ' of ' + words(a.amount) + (a.kind === 'Transfer' ? ' from ' + a.bank + ' to ' + a.to : a.kind === 'Withdrawal' ? ' from ' + a.bank : ' into ' + a.bank) + '.';
    if (a.t === 'card') return ((cardById(a.card) || {}).Name || 'Card') + (a.kind === 'Payment' ? ' bill paid, ' + words(a.amount) + (a.from ? ' from ' + a.from : '') : ' refund ' + words(a.amount)) + '.';
    if (a.t === 'wallet') return 'Wallet load of ' + words(a.amount) + ', ' + words(a.total) + ' from the card.';
    if (a.t === 'bal') return a.bank + ' balance ' + words(a.amount) + '.';
    return '';
  }
  function doSave() {
    var acts = S.acts; if (!acts || !acts.length) return;
    var undo = commit(acts), n = acts.length, tot = sum(acts, function (a) { return a.t === 'wallet' ? a.total : a.amount; });
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {}
    closeVoice();
    toastAct('Saved ' + (n > 1 ? n + ' entries · ' : '') + inr(tot), 'Undo', function () { rollback(undo); });
  }
  /* small pickers (iOS action-sheet style) */
  function pick(kind, i) {
    var a = S.acts[i], opts = [];
    if (kind === 'cat') opts = cats().map(function (c) { return [c.Name, (window.catEmoji ? catEmoji(c.Name) + ' ' : '') + c.Name, c.Name === a.category]; });
    if (kind === 'pay') {
      ['GPay', 'PhonePe', 'Paytm', 'UPI', 'Debit card', 'Bank transfer'].forEach(function (m) { opts.push(['m:' + m, m + ' · ' + upiBank(m), a.mode === m && !a.payAssumed]); });
      opts.push(['m:Cash', '💵 Cash', a.mode === 'Cash' && !a.payAssumed]);
      activeCards().forEach(function (c) { opts.push(['c:' + c.ID, '💳 ' + c.Name, a.mode === 'Credit card' && a.card === c.ID]); });
      banks().forEach(function (b) { opts.push(['b:' + b, '🏦 UPI from ' + b, a.mode === 'UPI' && a.bank === b]); });
    }
    if (kind === 'bank' || kind === 'from') opts = banks().map(function (b) { return [b, '🏦 ' + b, (kind === 'bank' ? a.bank : a.from) === b]; });
    if (kind === 'date') { for (var k = 0; k < 7; k++) { var d = dAdd(today(), -k); opts.push([d, dayLbl(d), a.date === d]); } opts.push(['pickdate', '📅 Another date…', false]); }
    var sh = document.createElement('div'); sh.className = 'vs-bg'; sh.style.zIndex = 90;
    var box = document.createElement('div'); box.className = 'vs'; box.style.zIndex = 91; box.style.maxHeight = '70vh';
    box.innerHTML = '<div class="list">' + opts.map(function (o) { return '<div class="li noicon" data-o="' + esc(o[0]) + '"><div class="tx"><div class="t1">' + esc(o[1]) + '</div></div>' + (o[2] ? '<span style="color:var(--accent);font-weight:700">✓</span>' : '') + '</div>'; }).join('') + '</div>' +
      (kind === 'date' ? '<input type="date" id="pkDate" max="' + today() + '" style="position:absolute;opacity:0;pointer-events:none">' : '');
    document.body.appendChild(sh); document.body.appendChild(box);
    function close() { sh.remove(); box.remove(); }
    sh.onclick = close;
    box.onclick = function (e) {
      var o = e.target.closest('[data-o]'); if (!o) return; var v = o.dataset.o;
      if (v === 'pickdate') { var inp = box.querySelector('#pkDate'); inp.style.pointerEvents = 'auto'; inp.onchange = function () { if (inp.value && inp.value <= today()) { a.date = inp.value; a.dateSaid = true; } close(); preview(); }; if (inp.showPicker) try { inp.showPicker(); return; } catch (x) {} inp.click(); return; }
      if (kind === 'cat') { a.category = v; a.catSure = true; }
      if (kind === 'pay') { a.payAssumed = false; a.amb = null; if (v.indexOf('m:') === 0) { a.mode = v.slice(2); a.card = ''; a.bank = a.mode === 'Cash' ? '' : upiBank(a.mode); } else if (v.indexOf('c:') === 0) { a.mode = 'Credit card'; a.card = v.slice(2); a.bank = ''; } else { a.mode = 'UPI'; a.bank = v.slice(2); a.card = ''; } }
      if (kind === 'bank') a.bank = v; if (kind === 'from') a.from = v;
      if (kind === 'date') { a.date = v; a.dateSaid = v !== today(); }
      close(); preview();
    };
  }
  function editAmt(i) {
    var el = S.el.querySelectorAll('.pv-amt')[i], a = S.acts[i]; if (!el || a.t === 'wallet') return;
    el.innerHTML = '<input inputmode="decimal" value="' + a.amount + '" style="width:92px;font:inherit;text-align:right;border:0;background:var(--fill);border-radius:8px;padding:2px 6px;color:inherit">';
    var inp = el.querySelector('input'); inp.focus(); inp.select();
    function done() { var v = Number(String(inp.value).replace(/[^\d.]/g, '')); if (v > 0) a.amount = Math.round(v * 100) / 100; preview(); }
    inp.onblur = done; inp.onkeydown = function (e) { if (e.key === 'Enter') inp.blur(); };
  }

  /* answers */
  function showAnswer(q, text) {
    var r = answer(q); S.lastAns = r;
    var mx = Math.max.apply(null, (r.bars || []).map(function (b) { return Math.abs(b[1]); }).concat([1]));
    S.el.innerHTML = top('Answer') + '<div class="vs-heard" style="min-height:0;font-size:15px;font-weight:500;color:var(--muted)">“' + esc(text) + '”</div>' +
      '<div class="ans"><div class="q">' + esc(r.q || '') + '</div><div class="big">' + r.big + '</div><div class="say">' + esc(r.say || '') + '</div>' +
      (r.pct !== null && r.pct !== undefined ? '<div class="bars"><div class="br"><span></span><span></span><div class="t"><i style="width:' + Math.round(r.pct * 100) + '%;background:' + (r.pct >= 1 ? 'var(--critical)' : 'var(--accent)') + '"></i></div></div></div>' : '') +
      ((r.bars || []).length > 1 ? '<div class="bars">' + r.bars.map(function (b) { return '<div class="br"><span>' + esc(b[0]) + '</span><b>' + inr(b[1]) + '</b><div class="t"><i style="width:' + Math.max(2, Math.round(Math.abs(b[1]) / mx * 100)) + '%"></i></div></div>'; }).join('') + '</div>' : '') +
      ((r.rows || []).length ? '<div class="rows">' + r.rows.map(function (w) { return '<div class="rw"><span>' + esc(w[0]) + '</span><span>' + esc(w[1]) + '</span><b>' + esc(w[2]) + '</b></div>'; }).join('') + '</div>' : '') +
      (r.cat !== undefined ? '<button class="more" data-v="more">' + (r.more ? 'Show all ' + r.more + ' entries ›' : 'Open in Spending ›') + '</button>' : '') + '</div>' +
      '<div class="vs-acts" style="grid-template-columns:1fr"><button class="pv-act" data-v="again">' + (SR ? '🎤 Ask another' : 'Ask another') + '</button></div>';
    speak(r.speak);
  }

  if (D) shell(); else document.addEventListener('DOMContentLoaded', shell);
})();

</script>
</body>
</html>
