<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<title>Family Finance Tracker</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e0da;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7873;
  --accent: #2a78d6; --accent-ink: #ffffff;
  --s-income: #2a78d6; --s-spend: #eb6834; --s-emi: #1baf7a;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --grid: #e7e5df;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #242422; --border: #333330;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8e8d86;
    --accent: #3987e5; --accent-ink: #ffffff;
    --s-income: #3987e5; --s-spend: #d95926; --s-emi: #199e70; --grid: #2c2c2a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.hbar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; margin-right: auto; }
.monthnav { display: flex; align-items: center; gap: 4px; }
.monthnav .lbl { min-width: 132px; text-align: center; font-weight: 600; }
.monthnav input[type=month] { position: absolute; opacity: 0; pointer-events: none; width: 0; }
.iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.pill { font-size: 12px; color: var(--muted); }
nav.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 96px; }
h2 { font-size: 15px; margin: 0 0 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { input.cell { width: 80px; } }
@media (max-width: 820px) { .g4 { grid-template-columns: 1fr 1fr; } .g2 { grid-template-columns: 1fr; } }

.kpi .k { color: var(--text-2); font-size: 12px; }
.kpi .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
.kpi .s { color: var(--muted); font-size: 12px; margin-top: 2px; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; color: var(--text-2); font-weight: 600; }
td.r, th.r { text-align: right; }
tr.total td { font-weight: 700; border-bottom: 0; }
tr.dim td { color: var(--muted); }
.scroll { overflow-x: auto; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st-good { color: var(--good); } .st-warn { color: #b57e00; } .st-crit { color: var(--critical); } .st-muted { color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-warn { color: var(--warning); } }

.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar > i.over { background: var(--critical); }
.bar > i.hi { background: var(--critical); }
.hidden { display: none !important; }
.preview { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 12px; font-size: 13px; }
.due-soon td:first-child { border-left: 3px solid var(--critical); }
.hide-sm {} @media (max-width: 560px) { .hide-sm { display: none; } }
:root { --bar: #2a78d6; }

.btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--critical); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
input.in, select.in { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 9px; min-width: 0; }
input.in.amt { width: 110px; text-align: right; }
input.cell { width: 100px; text-align: right; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; }
input.cell:hover, input.cell:focus { border-color: var(--border); background: var(--surface); }
.chk { width: 18px; height: 18px; accent-color: var(--good); cursor: pointer; }
.note { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 12px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: var(--surface); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.fab { position: fixed; right: 18px; bottom: 18px; z-index: 30; border: 0; border-radius: 28px; padding: 14px 20px; background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.2); cursor: pointer; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .modal-bg { align-items: center; } }
.modal { background: var(--surface); width: 100%; max-width: 440px; border-radius: 14px 14px 0 0; padding: 18px; max-height: 90vh; overflow: auto; }
@media (min-width: 640px) { .modal { border-radius: 14px; } }
.modal label { display: block; font-size: 12px; color: var(--text-2); margin: 10px 0 4px; }
.modal .in { width: 100%; }
.modal .actions { display: flex; gap: 8px; margin-top: 16px; }

.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 60; font-size: 13px; }
.saving { font-size: 12px; color: var(--muted); }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-2); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); white-space: nowrap; z-index: 5; }
.tip b { display: block; margin-bottom: 2px; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.loading { text-align: center; padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">Family Finance</div>
    <div class="monthnav">
      <button class="iconbtn" id="prevM" aria-label="Previous month">‹</button>
      <button class="btn lbl" id="mLabel"></button>
      <input type="month" id="mPick">
      <button class="iconbtn" id="nextM" aria-label="Next month">›</button>
      <button class="btn sm" id="todayM">This month</button>
    </div>
    <span class="saving" id="saving"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"><div class="loading">Loading your data from Google Drive…</div></main>
<button class="fab" id="fab">+ Expense</button>

<style>
#ffLogin { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px; }
#ffLogin .box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; text-align: center; }
#ffLogin img { width: 64px; height: 64px; border-radius: 14px; }
#ffLogin h1 { font-size: 20px; margin: 10px 0 4px; }
#ffLogin label { display: block; text-align: left; font-size: 12px; color: var(--text-2); margin: 14px 0 4px; font-weight: 600; }
#ffLogin input { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); }
#ffLogin #ffPin { font-size: 22px; text-align: center; letter-spacing: 4px; }
#ffLogin button { width: 100%; margin-top: 16px; padding: 13px; font-size: 16px; font-weight: 600; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
#ffLogin .err { color: var(--critical); font-size: 13px; margin-top: 10px; min-height: 18px; }
#ffLogin .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
header { padding-top: env(safe-area-inset-top); }
main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.fab { bottom: calc(18px + env(safe-area-inset-bottom)); }
</style>
<div id="ffLogin"><form class="box" id="ffForm">
  <img src="apple-touch-icon.png" alt="">
  <h1>Family Finance</h1>
  <div class="hint" style="margin-top:0">Your data stays in your Google Sheet.</div>
  <div id="ffUrlWrap"><label for="ffUrl">App link (from Apps Script, ends with /exec)</label>
  <input id="ffUrl" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <label for="ffPin">PIN</label>
  <input id="ffPin" type="password" autocomplete="current-password" required>
  <button id="ffBtn">Unlock</button>
  <div class="err" id="ffErr"></div>
  <div class="hint" id="ffChange" style="display:none"><a href="#" id="ffEditUrl">Change app link</a></div>
</form></div>
<script>
/* ===== iPhone app bridge: talks to your Google Apps Script over the internet using your PIN ===== */
(function () {
  var K_URL = 'ff_api_url', K_TOK = 'ff_token', queue = [];
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function post(body) {
    return fetch(get(K_URL), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { return r.text(); }).then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('The app link doesn\'t look right. Check it ends with /exec and the deployment access is "Anyone".'); } });
  }
  function exec(fn, args, ok, fail) {
    if (!get(K_URL) || !get(K_TOK)) { queue.push([fn, args, ok, fail]); showLogin(); return; }
    post({ action: 'call', token: get(K_TOK), fn: fn, args: args }).then(function (res) {
      if (res.ok) { ok && ok(res.result); }
      else if (res.error === 'AUTH') { set(K_TOK, null); queue.push([fn, args, ok, fail]); showLogin('Please unlock again.'); }
      else { fail && fail(new Error(res.error)); }
    }, function (e) { fail && fail(new Error(navigator.onLine === false ? 'No internet connection.' : (e.message || 'Could not reach Google.'))); });
  }
  window.google = { script: { get run() {
    var ok, fail, px = new Proxy({}, { get: function (t, n) {
      if (n === 'withSuccessHandler') return function (f) { ok = f; return px; };
      if (n === 'withFailureHandler') return function (f) { fail = f; return px; };
      return function () { exec(n, [].slice.call(arguments), ok, fail); };
    } });
    return px;
  } } };
  function $(id) { return document.getElementById(id); }
  function showLogin(msg) {
    $('ffLogin').style.display = 'flex'; $('ffErr').textContent = msg || '';
    var hasUrl = !!get(K_URL); $('ffUrl').value = get(K_URL) || '';
    $('ffUrlWrap').style.display = hasUrl ? 'none' : ''; $('ffChange').style.display = hasUrl ? '' : 'none';
    setTimeout(function () { (hasUrl ? $('ffPin') : $('ffUrl')).focus(); }, 100);
  }
  $('ffEditUrl').onclick = function (e) { e.preventDefault(); $('ffUrlWrap').style.display = ''; $('ffChange').style.display = 'none'; $('ffUrl').focus(); };
  $('ffForm').onsubmit = function (e) {
    e.preventDefault();
    var url = $('ffUrl').value.trim() || get(K_URL);
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url || '')) { $('ffErr').textContent = 'Paste the Web app link from Apps Script (it ends with /exec).'; $('ffUrlWrap').style.display = ''; return; }
    set(K_URL, url); $('ffBtn').disabled = true; $('ffBtn').textContent = 'Checking…'; $('ffErr').textContent = '';
    post({ action: 'login', pin: $('ffPin').value }).then(function (res) {
      $('ffBtn').disabled = false; $('ffBtn').textContent = 'Unlock';
      if (!res.ok) { $('ffErr').textContent = res.error; return; }
      set(K_TOK, res.token); $('ffPin').value = ''; $('ffLogin').style.display = 'none';
      var q = queue.splice(0); q.forEach(function (c) { exec.apply(null, c); });
    }, function (err) { $('ffBtn').disabled = false; $('ffBtn').textContent = 'Unlock'; $('ffErr').textContent = err.message; });
  };
  window.ffLock = function () {
    if (!confirm('Lock the app on this phone? You will need the PIN to open it again.')) return;
    var t = get(K_TOK); set(K_TOK, null); if (t) post({ action: 'logout', token: t }).catch(function () {}); location.reload();
  };
  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.querySelector('.hbar');
    if (bar) { var b = document.createElement('button'); b.className = 'iconbtn'; b.title = 'Lock'; b.setAttribute('aria-label', 'Lock app'); b.textContent = '🔒'; b.onclick = window.ffLock; bar.appendChild(b); }
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>

<script>
/* ======================= State & utilities ======================= */
var D = null;                       // all tables
var M = ym(new Date());             // selected month 'YYYY-MM'
var TAB = 'dash';
var expFilter = '';
var KEYS = { People:['Name'], Categories:['Name'], Banks:['Name'], Loans:['ID'], Income:['Month','Person'],
             Budgets:['Month','Category'], Expenses:['ID'], EmiPayments:['Month','LoanID'], Funds:['Name'], FundTxns:['ID'],
             Cards:['ID'], CardEmis:['ID'], CardTxns:['ID'], CardStatements:['ID'], AppSettings:['Key'] };
var TABS = [['dash','Dashboard'],['exp','Expenses'],['plan','Income & Budget'],['loans','EMIs'],['cards','Credit Cards'],['funds','Savings'],['trend','Trends'],['set','Settings']];

function ym(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function today() { var d = new Date(); return ym(d) + '-' + ('0' + d.getDate()).slice(-2); }
function addM(m, n) { var p = m.split('-'); return ym(new Date(+p[0], +p[1] - 1 + n, 1)); }
function diffM(a, b) { var x = a.split('-'), y = b.split('-'); return (y[0] - x[0]) * 12 + (y[1] - x[1]); }
var MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function mLabel(m, short) { var p = m.split('-'); var n = MN[+p[1] - 1]; return (short ? n.slice(0, 3) : n) + ' ' + (short ? p[0].slice(2) : p[0]); }
function inr(n, noSym) { if (n === '' || n == null || isNaN(n)) return '—'; var s = Math.round(Math.abs(n)).toLocaleString('en-IN'); return (n < 0 ? '−' : '') + (noSym ? '' : '₹') + s; }
function num(v) { return v === '' || v == null ? 0 : Number(v) || 0; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ord(n) { n = +n; var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function $(id) { return document.getElementById(id); }
function sum(a, f) { return a.reduce(function (t, x) { return t + (f ? f(x) : x); }, 0); }

/* ======================= Backend bridge ======================= */
var pending = 0;
function api(fn) {
  var args = [].slice.call(arguments, 1);
  pending++; $('saving').textContent = 'Saving…';
  return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(function (r) { done(); res(r); })
      .withFailureHandler(function (e) { done(); toast('Could not save: ' + (e && e.message || e)); rej(e); load(); })[fn].apply(null, args);
  });
  function done() { pending--; $('saving').textContent = pending ? 'Saving…' : 'Saved ✓'; }
}
function matchKeys(table, a, b) { return KEYS[table].every(function (k) { return String(a[k]) === String(b[k]); }); }
function save(table, obj) {
  var arr = D[table], key = obj._orig ? (function () { var o = {}; o[KEYS[table][0]] = obj._orig; return o; })() : obj;
  if (KEYS[table][0] === 'ID' && !obj.ID) obj.ID = 'n' + Date.now().toString(36);
  if (table === 'Expenses' || table === 'FundTxns' || table === 'CardTxns') obj.Month = String(obj.Date).slice(0, 7);
  if (obj._orig && obj._orig !== obj[KEYS[table][0]]) localCascade(table, obj._orig, obj[KEYS[table][0]]);
  var i = arr.findIndex(function (r) { return matchKeys(table, r, key); });
  var clean = Object.assign({}, obj); delete clean._orig;
  if (i >= 0) arr[i] = Object.assign({}, arr[i], clean); else arr.push(clean);
  render();
  return api('upsert', table, obj);
}
function del(table, keyObj) {
  D[table] = D[table].filter(function (r) { return !matchKeys(table, r, keyObj); });
  render();
  return api('removeRow', table, keyObj);
}
function localCascade(table, from, to) {
  var map = { People: [['Income','Person']], Categories: [['Expenses','Category'],['Budgets','Category']], Banks: [['Loans','Bank']], Funds: [['FundTxns','Fund']] }[table] || [];
  map.forEach(function (p) { D[p[0]].forEach(function (r) { if (r[p[1]] === from) r[p[1]] = to; }); });
}
function load() {
  google.script.run.withSuccessHandler(function (d) { D = d; ['Funds', 'FundTxns', 'Cards', 'CardEmis', 'CardTxns', 'CardStatements', 'AppSettings'].forEach(function (k) { D[k] = D[k] || []; }); render(); })
    .withFailureHandler(function (e) { $('app').innerHTML = '<div class="card">Could not load data: ' + esc(e.message || e) + '<br><span class="note">Did you run <b>setup</b> once in the Apps Script editor?</span></div>'; })
    .getAll();
}
function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3000); }

/* ======================= Calculations ======================= */
function people() { return D.People.filter(function (p) { return p.Active; }).sort(function (a, b) { return num(a.Order) - num(b.Order); }); }
function cats(all) { return D.Categories.filter(function (c) { return all || c.Active; }).sort(function (a, b) { return num(a.Order) - num(b.Order); }); }

// first month you started tracking (earliest month with any entry) – nothing is counted before it
function startMonth() {
  var all = D.Income.map(function (r) { return r.Month; }).concat(D.Expenses.map(function (r) { return r.Month; }), D.EmiPayments.map(function (r) { return r.Month; })).filter(Boolean).sort();
  return all[0] || ym(new Date());
}
function loanActive(l, m) {
  if (m < startMonth()) return false;
  if (l.FirstMonth && m < l.FirstMonth) return false;
  if (l.LastMonth && m > l.LastMonth) return false;
  if (l.Status === 'Closed') { if (!l.ClosedMonth) return false; if (m >= l.ClosedMonth) return false; }
  return true;
}
function remaining(l, m) { return loanActive(l, m) ? diffM(m, l.LastMonth) + 1 : 0; }
function isPaid(l, m) { return D.EmiPayments.some(function (p) { return p.Month === m && p.LoanID === l.ID; }); }
function loansFor(m) { return D.Loans.filter(function (l) { return loanActive(l, m); }).sort(function (a, b) { return num(a.DueDay) - num(b.DueDay) || a.Name.localeCompare(b.Name); }); }

function incomeFor(m) {
  if (m < startMonth()) return [];
  return people().map(function (p) {
    var r = D.Income.find(function (i) { return i.Month === m && i.Person === p.Name; }) || {};
    return { name: p.Name, expected: r.Expected !== undefined && r.Expected !== '' ? num(r.Expected) : num(p.ExpectedIncome), actual: r.Actual === undefined || r.Actual === '' ? null : num(r.Actual), note: r.Note || '' };
  });
}
function budgetFor(m) {
  var exps = D.Expenses.filter(function (e) { return e.Month === m; });
  var list = cats(true).map(function (c) {
    var b = D.Budgets.find(function (x) { return x.Month === m && x.Category === c.Name; });
    var spent = sum(exps.filter(function (e) { return e.Category === c.Name; }), function (e) { return num(e.Amount); });
    return { name: c.Name, planned: b ? num(b.Planned) : (c.Active && m >= startMonth() ? num(c.DefaultPlanned) : 0), custom: !!b, spent: spent, active: c.Active };

function num(v) { return v === '' || v == null ? 0 : Number(v) || 0; }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function sum(a, f) { return a.reduce(function (t, x) { return t + (f ? f(x) : x); }, 0); }
function chip(k, t) { return '<span class="status st-' + k + '">' + esc(t) + '</span>'; }

/* ======================= Calculations ======================= */
function cards(all) { return D.Cards.filter(function (c) { return all || c.Active; }).sort(function (a, b) { return num(a.Order) - num(b.Order); }); }

  var st = startMonth();
  for (var i = 11; i >= 0; i--) {
    var m = addM(M, -i); if (m < st) continue;
    var s = summary(m), iv = s.actual !== null ? s.actual : s.expected, spv = s.future ? Math.max(s.planned, s.spent) : s.spent;
    var net = iv - spv - s.emi + s.fromFunds - s.toFunds;
    months.push(m); inc.push(iv); sp.push(spv); em.push(s.emi); fr.push(s.fromFunds - s.toFunds); nt.push(net);
    rows = '<tr><td>' + mLabel(m) + (s.future ? ' <span class="note">(projected)</span>' : '') + '</td><td class="r num">' + inr(iv) + (s.incFromActual ? '' : ' <span class="note">exp.</span>') + '</td><td class="r num">' + inr(spv) + (s.future && spv === s.planned ? ' <span class="note">plan</span>' : '') + '</td><td class="r num">' + inr(s.emi) + '</td><td class="r num">' + inr(iv - spv - s.emi) + '</td><td class="r num">' + (s.fromFunds - s.toFunds ? inr(s.fromFunds - s.toFunds) : '—') + '</td><td class="r num"><b>' + inr(net) + '</b></td></tr>' + rows;
  }
  barChart($('chTrend'), months, [{ name: 'Income', color: 'var(--s-income)', values: inc }, { name: 'Spending', color: 'var(--s-spend)', values: sp }, { name: 'EMI', color: 'var(--s-emi)', values: em }]);
  $('trendTbl').innerHTML = '<table><tr><th>Month</th><th class="r">Income</th><th class="r">Spending</th><th class="r">EMI</th><th class="r">Surplus / deficit</th><th class="r">From savings (net)</th><th class="r">Net</th></tr>' + rows +
    '<tr class="total"><td>12-month total</td><td class="r num">' + inr(sum(inc)) + '</td><td class="r num">' + inr(sum(sp)) + '</td><td class="r num">' + inr(sum(em)) + '</td><td class="r num">' + inr(sum(inc) - sum(sp) - sum(em)) + '</td><td class="r num">' + inr(sum(fr)) + '</td><td class="r num">' + inr(sum(nt)) + '</td></tr></table>';
  var m6 = months.filter(function (m) { return m <= ym(new Date()); }).slice(-6), names = cats(true).map(function (c) { return c.Name; });
  var h = '<table><tr><th>Category</th>' + m6.map(function (m) { return '<th class="r">' + mLabel(m, true) + '</th>'; }).join('') + '<th class="r">Avg</th></tr>';
  names.forEach(function (n) {
    var vals = m6.map(function (m) { return sum(D.Expenses.filter(function (e) { return e.Month === m && e.Category === n; }), function (e) { return num(e.Amount); }); });
    if (!sum(vals)) return;
    h += '<tr><td>' + esc(n) + '</td>' + vals.map(function (v) { return '<td class="r num">' + (v ? inr(v, true) : '—') + '</td>'; }).join('') + '<td class="r num">' + inr(sum(vals) / m6.length, true) + '</td></tr>';
  });
  $('catTbl').innerHTML = h + '</table>';
};

/* ---------- Settings ---------- */
function vSet() {
  var html = '<div class="grid g2"><div class="card"><div class="row"><h2 style="margin:0">People / income sources</h2><span class="spacer"></span><button class="btn sm" data-add="People">+ Add</button></div><table style="margin-top:8px"><tr><th>Name</th><th class="r">Expected monthly</th><th>Active</th><th></th></tr>';
  D.People.slice().sort(function (a, b) { return num(a.Order) - num(b.Order); }).forEach(function (p) {
    html += '<tr class="' + (p.Active ? '' : 'dim') + '"><td>' + esc(p.Name) + '</td><td class="r num">' + inr(p.ExpectedIncome) + '</td><td>' + (p.Active ? 'Yes' : 'No') + '</td><td class="r"><button class="btn sm" data-edit="People" data-name="' + esc(p.Name) + '">Edit</button></td></tr>';
  });
  html += '</table></div><div class="card"><div class="row"><h2 style="margin:0">Banks</h2><span class="spacer"></span><button class="btn sm" data-add="Banks">+ Add</button></div><table style="margin-top:8px"><tr><th>Bank</th><th class="r">Balance</th><th>Updated</th><th></th></tr>';
  D.Banks.forEach(function (b) {
    html += '<tr><td>' + esc(b.Name) + '</td><td class="r num">' + inr(b.CurrentBalance) + '</td><td class="note">' + esc(b.UpdatedOn || '—') + '</td><td class="r"><button class="btn sm" data-edit="Banks" data-name="' + esc(b.Name) + '">Edit</button></td></tr>';
  });
  html += '</table></div></div>';
  html += '<div class="card"><div class="row"><h2 style="margin:0">Spending categories (default monthly plan)</h2><span class="spacer"></span><button class="btn sm" data-add="Categories">+ Add</button></div><table style="margin-top:8px"><tr><th>Category</th><th class="r">Default planned</th><th>Active</th><th></th></tr>';
  cats(true).forEach(function (c) {
    html += '<tr class="' + (c.Active ? '' : 'dim') + '"><td>' + esc(c.Name) + '</td><td class="r num">' + inr(c.DefaultPlanned) + '</td><td>' + (c.Active ? 'Yes' : 'No') + '</td><td class="r"><button class="btn sm" data-edit="Categories" data-name="' + esc(c.Name) + '">Edit</button></td></tr>';
  });
  html += '<tr class="total"><td>Total</td><td class="r num">' + inr(sum(cats(), function (c) { return num(c.DefaultPlanned); })) + '</td><td></td><td></td></tr></table>' +
    '<p class="note">Turn a category off (Active = No) instead of deleting it, so older months keep their history.</p></div>';
  html += '<div class="card"><h2>Credit cards</h2><table><tr><td>Count card EMIs in the monthly surplus / deficit</td><td class="r"><select class="in" data-appsetting="CountCardEmis"><option value="No">No (loans only)</option><option value="Yes"' + (countCardEmis() ? ' selected' : '') + '>Yes (loans + cards)</option></select></td></tr></table>' +
    '<p class="note">Either way, the EMIs tab shows loan EMIs, card EMIs and the combined total.</p></div>';
  html += '<div class="card"><h2>Your data</h2><p>Everything is stored in your Google Sheet in Google Drive. You can open it any time, and Google keeps version history (File → Version history).</p>' +
    (D.spreadsheetUrl ? '<a class="btn" href="' + esc(D.spreadsheetUrl) + '" target="_blank">Open Google Sheet ↗</a>' : '') + '</div>';
  return html;
}
function settingModal(table, name) {
  var rec = name ? D[table].find(function (r) { return r.Name === name; }) : null;
  var isNew = !rec; rec = rec || { Name: '', Active: true };
  var extra = table === 'People' ? field('Expected monthly income', '<input class="in" name="V" inputmode="decimal" value="' + esc(rec.ExpectedIncome || '') + '">')
            : table === 'Categories' ? field('Default planned per month', '<input class="in" name="V" inputmode="decimal" value="' + esc(rec.DefaultPlanned || '') + '">')
            : field('Current balance', '<input class="in" name="V" inputmode="decimal" value="' + esc(rec.CurrentBalance === '' ? '' : rec.CurrentBalance) + '">');
  var active = table === 'Banks' ? '' : field('Active', '<select class="in" name="Active"><option value="1">Yes</option><option value="0"' + (rec.Active ? '' : ' selected') + '>No</option></select>');
  modal((isNew ? 'Add ' : 'Edit ') + { People: 'person', Categories: 'category', Banks: 'bank' }[table],
    field('Name', '<input class="in" name="Name" value="' + esc(rec.Name) + '" required>') + extra + active,
    function (f) {
      var nm = f.Name.value.trim(); if (!nm) return false;
      if ((isNew || nm !== name) && D[table].some(function (r) { return r.Name === nm; })) { toast('That name already exists'); return false; }
      var o = { Name: nm };
      if (!isNew && nm !== name) o._orig = name;
      var v = f.V.value === '' ? '' : evalAmt(f.V.value);
      if (table === 'People') { o.ExpectedIncome = v; o.Active = f.Active.value === '1' ? 'TRUE' : 'FALSE'; o.Order = rec.Order || D.People.length + 1; }
      if (table === 'Categories') { o.DefaultPlanned = v; o.Active = f.Active.value === '1' ? 'TRUE' : 'FALSE'; o.Order = rec.Order || D.Categories.length + 1; }
      if (table === 'Banks') { o.CurrentBalance = v; o.UpdatedOn = today(); }
      save(table, o).then(function () {});
      // keep local Active as boolean
      var r = D[table].find(function (x) { return x.Name === nm; }); if (r && 'Active' in o) { r.Active = o.Active === 'TRUE'; render(); }
    });
}

/* ======================= Modal helpers ======================= */
function field(label, input) { return '<label>' + esc(label) + '</label>' + input; }
function modal(title, body, onSave, onDelete) {
  var bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<form class="modal"><h2>' + esc(title) + '</h2>' + body + '<div class="actions">' + (onDelete ? '<button type="button" class="btn danger" data-del>Delete</button>' : '') + '<span class="spacer"></span><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save</button></div></form>';
  document.body.appendChild(bg);
  var f = bg.querySelector('form'), close = function () { bg.remove(); };
  bg.onclick = function (e) { if (e.target === bg) close(); };
  bg.querySelector('[data-cancel]').onclick = close;
  if (onDelete) bg.querySelector('[data-del]').onclick = function () { if (onDelete() !== false) close(); };
  f.onsubmit = function (e) { e.preventDefault(); if (onSave(f) !== false) close(); };
  var first = f.querySelector('[autofocus]') || f.querySelector('input'); first && first.focus();
}

/* ======================= Charts (plain SVG) ======================= */
function niceMax(v) { if (v <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function shortInr(v) { return v >= 1e7 ? (v / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr' : v >= 1e5 ? (v / 1e5).toFixed(1).replace(/\.0$/, '') + 'L' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : String(Math.round(v)); }
function axes(W, H, pad, max) {
  var g = '';
  for (var i = 0; i <= 4; i++) {
    var y = pad.t + (H - pad.t - pad.b) * (1 - i / 4);
    g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (pad.l - 6) + '" y="' + (y + 4) + '" text-anchor="end">₹' + shortInr(max * i / 4) + '</text>';
  }
  return g;
}
function xLabels(months, W, pad, H, bw) {
  var n = months.length, step = Math.ceil(n / Math.max(1, Math.floor((W - pad.l - pad.r) / 46)));
  return months.map(function (m, i) { if (i % step) return ''; var x = pad.l + bw * (i + .5); return '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle">' + mLabel(m, true) + '</text>'; }).join('');
}
function barChart(el, months, series, opt) {
  opt = opt || {};
  var W = Math.max(300, el.clientWidth || 600), H = 230, pad = { l: 46, r: 8, t: 10, b: 24 };
  var max = niceMax(Math.max.apply(null, series.reduce(function (a, s) { return a.concat(s.values); }, [0])));
  var bw = (W - pad.l - pad.r) / months.length, ih = H - pad.t - pad.b, k = series.length;
  var inner = Math.min(opt.single ? bw - 2 : (bw * .78) / k, 22), gap = 2;
  var svg = axes(W, H, pad, max);
  months.forEach(function (m, i) {
    var groupW = inner * k + gap * (k - 1), x0 = pad.l + bw * i + (bw - groupW) / 2;
    series.forEach(function (s, j) {
      var v = s.values[i], h = Math.max(0, v / max * ih), x = x0 + j * (inner + gap), y = pad.t + ih - h, r = Math.min(4, inner / 2, h);
      if (h > 0) svg += '<path d="M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + inner - r) + 'Q' + (x + inner) + ',' + y + ' ' + (x + inner) + ',' + (y + r) + 'V' + (y + h) + 'Z" fill="' + s.color + '"/>';
    });
    svg += '<rect x="' + (pad.l + bw * i) + '" y="' + pad.t + '" width="' + bw + '" height="' + ih + '" fill="transparent" data-i="' + i + '"/>';
  });
  svg += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + (pad.t + ih) + '" y2="' + (pad.t + ih) + '" stroke="var(--muted)" stroke-width="1"/>';
  svg += xLabels(months, W, pad, H, bw);
  el.innerHTML = (k > 1 ? '<div class="legend">' + series.map(function (s) { return '<span style="--c:' + s.color + '">' + s.name + '</span>'; }).join('') + '</div>' : '') +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(series.map(function (s) { return s.name; }).join(', ')) + ' by month">' + svg + '</svg>';
  hover(el, function (i) { return '<b>' + mLabel(months[i]) + '</b>' + series.map(function (s) { return '<div><span class="sw" style="background:' + s.color + '"></span>' + s.name + ': ' + inr(s.values[i]) + '</div>'; }).join(''); });
}
function areaChart(el, months, vals, color, name) {
  var W = Math.max(300, el.clientWidth || 600), H = 230, pad = { l: 46, r: 8, t: 10, b: 24 };
  var max = niceMax(Math.max.apply(null, vals.concat([0]))), bw = (W - pad.l - pad.r) / months.length, ih = H - pad.t - pad.b;
  var pts = vals.map(function (v, i) { return [pad.l + bw * (i + .5), pad.t + ih - v / max * ih]; });
  var svg = axes(W, H, pad, max);
  if (pts.length) {
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('');
    svg += '<path d="' + line + 'L' + pts[pts.length - 1][0] + ',' + (pad.t + ih) + 'L' + pts[0][0] + ',' + (pad.t + ih) + 'Z" fill="' + color + '" opacity=".14"/>';
    svg += '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2"/>';
  }
  months.forEach(function (m, i) { svg += '<rect x="' + (pad.l + bw * i) + '" y="' + pad.t + '" width="' + bw + '" height="' + ih + '" fill="transparent" data-i="' + i + '"/>'; });
  svg += '<line class="xh" x1="0" x2="0" y1="' + pad.t + '" y2="' + (pad.t + ih) + '" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/><circle class="dot" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="2" style="display:none"/>';
  svg += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + (pad.t + ih) + '" y2="' + (pad.t + ih) + '" stroke="var(--muted)"/>' + xLabels(months, W, pad, H, bw);
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + name + ' by month">' + svg + '</svg>';
  var xh = el.querySelector('.xh'), dot = el.querySelector('.dot');
  hover(el, function (i) {
    xh.setAttribute('x1', pts[i][0]); xh.setAttribute('x2', pts[i][0]); xh.style.display = ''; dot.setAttribute('cx', pts[i][0]); dot.setAttribute('cy', pts[i][1]); dot.style.display = '';
    return '<b>' + mLabel(months[i]) + '</b>' + name + ': ' + inr(vals[i]);
  }, function () { xh.style.display = 'none'; dot.style.display = 'none'; });
}
function hover(el, html, leave) {
  var tip = document.createElement('div'); tip.className = 'tip'; tip.style.display = 'none'; el.appendChild(tip);
  el.querySelectorAll('rect[data-i]').forEach(function (r) {
    var show = function (e) {
      tip.innerHTML = html(+r.getAttribute('data-i')); tip.style.display = '';
      var b = el.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - b.left;
      tip.style.left = Math.min(Math.max(0, x + 12), b.width - tip.offsetWidth) + 'px'; tip.style.top = '8px';
    };
    r.addEventListener('mousemove', show); r.addEventListener('touchstart', show, { passive: true });
  });
  el.addEventListener('mouseleave', function () { tip.style.display = 'none'; leave && leave(); });
}

/* ======================= Events ======================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab],[data-goto],[data-filter],[data-editexp],[data-editloan],[data-add],[data-edit],[data-fundtx],[data-editfund],[data-edittx]');
  if (!t) return;
  if (t.dataset.tab || t.dataset.goto) { TAB = t.dataset.tab || t.dataset.goto; window.scrollTo(0, 0); render(); }
  else if (t.hasAttribute('data-filter')) { expFilter = t.dataset.filter; render(); }
  else if (t.dataset.editexp) expenseModal(D.Expenses.find(function (x) { return x.ID === t.dataset.editexp; }));
  else if (t.dataset.editloan) loanModal(D.Loans.find(function (x) { return x.ID === t.dataset.editloan; }));
  else if (t.dataset.add) settingModal(t.dataset.add);
  else if (t.dataset.edit) settingModal(t.dataset.edit, t.dataset.name);
  else if (t.dataset.fundtx) fundTxModal(t.dataset.fundtx, t.dataset.fund, t.dataset.amt);
  else if (t.dataset.editfund) fundModal(D.Funds.find(function (x) { return x.Name === t.dataset.editfund; }));
  else if (t.dataset.edittx) fundTxModal(null, null, null, D.FundTxns.find(function (x) { return x.ID === t.dataset.edittx; }));
});
document.addEventListener('change', function (e) {
  var t = e.target, d = t.dataset;
  if (d.emipaid) {
    var l = D.Loans.find(function (x) { return x.ID === d.emipaid; });
    if (t.checked) save('EmiPayments', { Month: M, LoanID: l.ID, PaidOn: today(), Amount: num(l.EMI) });
    else del('EmiPayments', { Month: M, LoanID: l.ID });
  } else if (d.bankbal !== undefined) {
    save('Banks', { Name: d.bankbal, CurrentBalance: t.value === '' ? '' : evalAmt(t.value), UpdatedOn: today() });
  } else if (d.inc) {
    var cur = incomeFor(M).find(function (i) { return i.name === d.person; });
    var o = { Month: M, Person: d.person, Expected: cur.expected, Actual: cur.actual === null ? '' : cur.actual };
    o[d.inc] = t.value === '' ? '' : evalAmt(t.value);
    save('Income', o);
  } else if (d.plan) {
    save('Budgets', { Month: M, Category: d.plan, Planned: t.value === '' ? 0 : evalAmt(t.value) });
  }
});
document.addEventListener('click', function (e) { var t = e.target.closest('[data-etab]'); if (t && !t.closest('.modal')) { ETAB = t.dataset.etab; render(); } });
document.addEventListener('change', function (e) { var k = e.target.dataset && e.target.dataset.appsetting; if (k) save('AppSettings', { Key: k, Value: e.target.value }); });
$('prevM').onclick = function () { M = addM(M, -1); expFilter = ''; render(); };
$('nextM').onclick = function () { M = addM(M, 1); expFilter = ''; render(); };
$('todayM').onclick = function () { M = ym(new Date()); render(); };
$('mLabel').onclick = function () { var p = $('mPick'); p.showPicker ? p.showPicker() : p.click(); };
$('mPick').onchange = function () { if (this.value) { M = this.value; render(); } };
$('fab').onclick = function () { expenseModal(); };
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 200); });

load();
</script>
